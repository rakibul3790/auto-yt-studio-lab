<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untitled — Fabelo Studio</title>
<style>
  @font-face { font-family: 'Caveat'; font-weight: 700; font-style: normal; src: url(data:font/woff2;base64,__CAVEAT__) format('woff2'); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #FBF7EE; }
</style>
<script src="../../../lib/scribble.js"></script>
<script src="../../lib/fabelo2.js"></script>
<script>window.__TIMING = __TIMING_JSON__;</script>
</head>
<body>
<script>
{
/* =====================================================================
   Fabelo Studio v2 starter scene. Copy to work/<slug>/film.src.html.
   1. Write film.audio.json, run voices.py FIRST, then copy the real line times into LINES below.
   2. Build shots on the beat grid: film.shot(t0, t1, {frame:[cx, cy, w, h]}) — the camera box
      is fitted to EVERY aspect ratio, so keep what matters inside the box.
   3. Join shots with film.cut(at, 'whip'|'ink'|'page'|'iris'|'match'|'dip'|'dissolve'|'smash'|'cut').
   4. Preview: node v2/tools/preview.js film.src.html prev "1,3,5" --timing voice/timing.json --sheet
   ===================================================================== */
const S = Scribble, C = S.palette, sv = S.svg, F2 = Fabelo2, E = F2.EASE;
const DUR = 12, G = 300;                     // G = ground line (world y)

const LINES = [                                // [speaker, start, end, text] from voice/timing.json
  ['narrator', 0.8, 3.4, "Every big idea starts as a tiny doodle."],
  ['narrator', 6.4, 9.6, "Keep drawing. It gets bigger."],
];

const film = F2.film(document.body, { duration: DUR, bpm: 90, fadeIn: 0.9, fadeOut: 1.4 });
const B = (n) => film.beat(n);                 // cut on the beat

/* SHOT 1 · wide: Scribble thinks */
const s1 = film.shot(0, B(9), { name: 'idea', frame: [0, 80, 900, 900] });
s1.layer(0.4, (t, v) => F2.bg.hills(v, { y: 220, h: 100, seed: 3, op: 0.3 }));     // parallax: far layers move less
s1.layer(0.7, (t, v) => F2.bg.clouds(t, v, { n: 3, y: -300, speed: 10 }));
const k1 = s1.character({ x: -120, scale: 2.4, pose: 'think', expr: 'thinking' });
k1.drawOn(0.2, 1.1).pose(3.6, 'pointUp', { dur: 0.35, expr: 'excited' });          // overshoot + follow-through are automatic
s1.prop('lightbulb', { x: 120, y: -150, scale: 0.9, at: 3.7 });
s1.cam.push(0.3, 5.5, 1.15, [-40, 40]);                                            // slow push-in
film.cue('sfx', 3.7, { name: 'chime', gain: 0.25 });
film.cut(B(9), 'whip');

/* SHOT 2 · close-up: the doodle grows */
const s2 = film.shot(B(9), DUR, { name: 'grow', frame: [-40, 20, 700, 700] });
const k2 = s2.character({ x: -150, scale: 2.3, pose: 'write', expr: 'happy' });
k2.pose(9.8, 'cheer', { dur: 0.4, expr: 'excited' });
s2.custom((t) => { const k = E.backOut(Math.max(0, Math.min(1, (t - 6.8) / 1.2))); return sv.g(S.propSVG('heart'), `translate(150 -40) scale(${(0.4 + 1.1 * k).toFixed(3)})`); }, 'front');
s2.cam.frame(6.5, 3.0, [0, -10, 900, 900], 'sineInOut');

film.title('Keep drawing.', { at: 9.9, until: 11.6, y: -380, size: 92 });
film.captions(LINES, { speakers: ['narrator'] });   // Shorts: animated word-by-word captions (red = the word being said)
film.ready(LINES);
}
</script>
</body>
</html>
