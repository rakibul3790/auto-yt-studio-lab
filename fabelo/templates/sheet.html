<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scribble — reference sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #FBF7EE; color: #1B1B1B; font-family: Inter, system-ui, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-family: Caveat, cursive; font-size: 56px; margin: 0 0 4px; }
  h2 { font-family: Caveat, cursive; font-size: 38px; margin: 40px 0 12px; border-bottom: 3px solid #1B1B1B; padding-bottom: 4px; }
  p.lead { margin: 0; color: #4A4A4A; max-width: 70ch; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  figure { margin: 0; background: #FFFDF8; border: 2px solid #E6DCC6; border-radius: 14px; padding: 10px 8px 8px; text-align: center; }
  figure svg { width: 100%; height: 170px; display: block; }
  figcaption { font-size: 13px; font-weight: 600; margin-top: 4px; }
  code { background: #EDE4D0; padding: 1px 6px; border-radius: 6px; font-size: 12px; }
</style>
<script src="../lib/scribble.js"></script>
</head>
<body>
<main>
  <h1>Scribble — reference sheet</h1>
  <p class="lead">Every pose, expression, costume and prop in the library, with the exact name to use in code. Example: <code>s.pose(3, 'think', { expr: 'thinking' })</code>.</p>
  <h2>Poses</h2><div class="grid" id="poses"></div>
  <h2>Expressions</h2><div class="grid" id="exprs"></div>
  <h2>Costumes</h2><div class="grid" id="costumes"></div>
  <h2>Props</h2><div class="grid" id="props"></div>
</main>
<script>
const NS = 'http://www.w3.org/2000/svg';
function cell(parent, inner, caption, label) {
  const fig = document.createElement('figure');
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', label || caption);
  svg.innerHTML = '<g>' + inner + '</g>';
  fig.appendChild(svg);
  const cap = document.createElement('figcaption');
  cap.textContent = caption;
  fig.appendChild(cap);
  parent.appendChild(fig);
  const b = svg.firstChild.getBBox(), pad = 12;
  const size = Math.max(b.width, b.height) + pad * 2;
  svg.setAttribute('viewBox', `${b.x + b.width / 2 - size / 2} ${b.y + b.height / 2 - size / 2} ${size} ${size}`);
}
const S = Scribble;
const exprFor = { shocked: 'shocked', think: 'thinking', sad: 'sad', cheer: 'excited', wave: 'happy', facepalm: 'angry', shrug: 'confused', scared: 'scared', victory: 'proud', explain: 'happy' };
Object.keys(S.POSES).forEach(p => cell(document.getElementById('poses'), S.characterSVG({ pose: p, expr: exprFor[p] || 'neutral' }), p, 'Pose ' + p));
Object.keys(S.EXPRESSIONS).forEach(e => cell(document.getElementById('exprs'), S.characterSVG({ pose: 'idle', expr: e }), e, 'Expression ' + e));
const holdFor = { caveman: 'spear', roman: 'scroll', scientist: 'lightbulb', explorer: 'book' };
Object.keys(S.COSTUMES).forEach(c => cell(document.getElementById('costumes'), S.characterSVG({ pose: holdFor[c] ? 'hold' : 'idle', expr: 'proud', costume: c, hold: holdFor[c] }), c, 'Costume ' + c));
Object.keys(S.PROPS).forEach(p => cell(document.getElementById('props'), S.propSVG(p, 0.5), p, 'Prop ' + p));
</script>
</body>
</html>
