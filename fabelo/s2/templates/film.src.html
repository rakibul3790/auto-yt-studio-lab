<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Smooth Scribble film</title>
<style>
@font-face{font-family:'Caveat';src:url(data:font/woff2;base64,__CAVEAT__) format('woff2');font-weight:700}
html,body{margin:0;background:#000;overflow:hidden}svg{display:block}
</style>
<script src="../../s2/lib/scribble2.js"></script>
<script src="../../s2/lib/sets2.js"></script></head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
/* Smooth Scribble starter film. Copy to work/<slug>/film.src.html.
   - The page takes its size from the recorder (--w/--h): 1920x1080 for long videos, 1080x1920 for Shorts.
     Write positions from W, H, GY (floor line) so the same file can do both.
   - Time every action to the REAL voice times in TIMING (emo_voice.py → timing.json, inlined by build_s2.py).
   - frame(t) draws one frame from scratch; window.__seek / __duration are what record2.js needs.
   - Draw order per shot: set → furniture → Scribble2.draw(...) → S2.night(...) (light layer) → captions/titles. */
const K = Scribble2, DUR = 14;
const TIMING = __TIMING_JSON__;
const W = window.innerWidth || 1920, H = window.innerHeight || 1080, V = H > W;     // V = vertical (Short)
const st = { W, H, GY: Math.round(H * (V ? 0.78 : 0.833)) };
const SC = (V ? 1.05 : 0.92) * Math.min(W, H) / 1080;                           // character scale
const svg = document.getElementById('s');
svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
const { prog, lp, lerp, clamp, walkAt, blinkAt } = S2;

function frame(t) {
  let s = K.defs(), world = '', over = '', fade = 0, cam = { z: 1, cx: W / 2, cy: H / 2 };
  if (t < 6.8) {
    // SHOT 1 — day: walk in from off screen, stop, turn to camera, wave
    world += S2.room(st);
    const x0 = -0.15 * W, x1 = W * 0.5, w0 = 0.4, speed = 460 * SC, wDur = (x1 - x0) / speed, w1 = w0 + wDur;
    let o = { scale: SC, y: st.GY, f: 1 };
    if (t < w1) o = Object.assign(o, { view: 'side', x: x0 + speed * Math.max(0, t - w0), pose: walkAt(Math.max(0, t - w0)), face: 'neutral', wind: 0.3, phase: t });
    else if (t < w1 + 0.4) o = Object.assign(o, { view: 'side', x: x1, pose: lp(walkAt(wDur), K.POSES.idleSide, prog(t, w1, w1 + 0.35)), face: 'neutral' });
    else if (t < w1 + 0.55) o = Object.assign(o, { view: 'q', x: x1, pose: K.POSES.idleQ, face: 'neutral' });
    else {
      const up = prog(t, 3.9, 4.25) * (1 - prog(t, 5.8, 6.2));
      const osc = t > 4.25 && t < 5.8 ? Math.sin((t - 4.25) * Math.PI * 4.2) * 15 : 0;
      const p = Object.assign({}, K.POSES.idleFront, { a2: [lerp(8, 100, up), lerp(-3, 48 + osc, up)], lean: Math.sin(t * 1.7) * 0.8 });
      o = Object.assign(o, { view: 'front', x: x1, pose: p, face: up > 0.3 ? 'happy' : 'smile', hands: ['relax', up > 0.4 ? 'open' : 'relax'], blink: blinkAt(t) && up < 0.3 });
    }
    world += K.draw(o);
    fade = clamp(1 - t / 0.6) + prog(t, 6.3, 6.8);
  } else {
    // SHOT 2 — night: sitting on the bed with the phone, then looks up
    world += S2.room(st, { night: true });
    const bx = W * (V ? 0.42 : 0.55);
    world += S2.bed(bx, st, SC, true);
    const down = prog(t, 11.0, 11.8), upU = prog(t, 11.9, 12.8);
    const p = { seat: 166, l1: [84, 86], l2: [80, 84], lean: lerp(16 + Math.sin(t * 1.3), 6, upU), tilt: lerp(14, -6, upU),
      a1: [lerp(6, 14, down), lerp(72, 30, down)], a2: [lerp(2, 10, down), lerp(74, 34, down)] };
    world += K.draw({ view: 'q', f: -1, x: bx, y: st.GY, scale: SC, pose: p, face: t > 12.4 ? 'smile' : t > 9.5 ? 'cry' : 'sad',
      look: t > 11.9 ? [0.3, -0.5] : [0.2, 0.8], hands: ['phone', 'fist'], phone: { ang: lerp(-30, -70, down), dy: -18 }, glow: down < 0.9, blink: blinkAt(t, 0.6) });
    over += S2.night(0.85, 1 - down, st);
    cam = { z: lerp(1.05, 1.25, prog(t, 7, 12)), cx: bx, cy: st.GY - 420 * SC };
    fade = clamp(1 - (t - 6.8) / 0.6) + prog(t, 13.3, 14);
  }
  s += `<g transform="translate(${W / 2} ${H / 2}) scale(${cam.z}) translate(${-cam.cx} ${-cam.cy})">${world}${over}</g>`;
  s += S2.caption(t, TIMING, st, { y: V ? H * 0.88 : H * 0.92 });                  // captions stay outside the camera
  if (fade > 0) s += `<rect width="${W}" height="${H}" fill="#0B0D14" opacity="${clamp(fade)}"/>`;
  svg.innerHTML = s;
}
window.__duration = DUR;
window.__seek = (t) => frame(t);
frame(new URLSearchParams(location.search).has('t') ? +new URLSearchParams(location.search).get('t') : 2);
</script>
</body></html>
