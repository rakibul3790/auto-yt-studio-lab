<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fabelo Studio — channel banner</title>
<style>
  @font-face { font-family: 'Caveat'; font-weight: 700; font-style: normal; src: url(data:font/woff2;base64,__CAVEAT__) format('woff2'); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #FBF7EE; }
</style>
<script src="../lib/scribble.js"></script>
</head>
<body>
<script>
{
/* YouTube banner 2560x1440. 1 unit = 1.44 px at that size.
   Visible: x ±889, y ±500.  Safe area for all devices (1546x423 px): x ±537, y ±147. */
const S = Scribble, C = S.palette, sv = S.svg;
const sc = S.createScene(document.body, { duration: 6, ground: 128, fadeIn: 0.01, fadeOut: 0.01, groundLine: false });

const paperBall = () =>
  sv.path('M-20 -4 L-24 -20 L-14 -34 L2 -38 L18 -32 L24 -18 L20 -4 L6 1 L-8 0 Z', { fill: C.white, w: 4 }) +
  sv.path('M-14 -30 L-4 -20 L-10 -8 M4 -34 L0 -22 L12 -14 L8 -4 M-22 -16 L-10 -20', { w: 2.5 });
const ball = (x, y, s, r) => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})">${paperBall()}</g>`;
const star = (x, y, s, c = C.ink) => `<g transform="translate(${x} ${y}) scale(${s})">${sv.path('M0 -14 L3.5 -4 L14 -4 L5.5 2.5 L9 13 L0 6.5 L-9 13 L-5.5 2.5 L-14 -4 L-3.5 -4 Z', { w: 3, stroke: c })}</g>`;
const spark = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})">${sv.path('M0 -12 L0 12 M-12 0 L12 0 M-7 -7 L-4 -4 M7 7 L4 4 M7 -7 L4 -4 M-7 7 L-4 4', { w: 3 })}</g>`;
const plane = (x, y, s, r) => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})">${sv.path('M-30 0 L30 -14 L-8 10 Z', { fill: C.white, w: 3.5 }) + sv.path('M30 -14 L-8 10 L-4 22 Z', { fill: '#EFE7D6', w: 3.5 })}</g>`;

/* ---------- back layer: floor, crumpled-paper staircase, doodles ---------- */
sc.custom(() => {
  let s = '';
  // sketchy floor under the whole scene (wide screens see it run edge to edge)
  s += sv.path('M-900 129 Q-450 125 0 129 T900 127', { w: 3, stroke: '#2A2A2A' });
  // staircase of crumpled mistakes rising toward Scribble (he climbed out of his failures)
  [[-850, 1], [-798, 2], [-746, 3], [-694, 4], [-642, 5]].forEach(([x, n], i) => {
    for (let k = 0; k < n; k++) s += ball(x, 128 - k * 33, 1.0, ((k * 53 + i * 29) % 50) - 25);
  });
  // a few loose papers on the floor
  s += ball(-560, 128, 0.8, 30);
  // dotted flight path of a paper plane looping over the title (decor, mostly outside safe area)
  s += `<path d="M-300 -300 C -100 -430, 250 -420, 420 -330 S 720 -200, 770 -335" fill="none" stroke="#9A9A9A" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 16"/>`;
  s += plane(800, -350, 1.3, -18);
  // stars & sparkles scattered around the edges
  s += star(-700, -330, 1.6) + star(-480, -420, 1.0) + spark(-820, -170, 1.2) + spark(620, 330, 1.4) +
       star(700, 250, 1.3) + star(-260, 360, 1.0) + spark(240, 380, 1.0) + star(860, -60, 1.1) + spark(-120, -440, 1.1);
  // big soft sun glow behind the right side
  s += `<circle cx="760" cy="40" r="190" fill="${C.ochre}" opacity="0.10"/>` + `<circle cx="760" cy="40" r="120" fill="${C.ochre}" opacity="0.12"/>`;
  s += star(760, 40, 2.2, C.ochre);
  return s;
}, 'back');

/* ---------- Scribble: the one and only ---------- */
const s = sc.character({ x: -400, scale: 1.40, pose: 'wave', expr: 'happy' });
s.look(0, [3, -1]);

// little sparkles of joy around his head
sc.custom(() => spark(-470, -120, 0.9) + spark(-318, -138, 0.7), 'front');

/* ---------- wordmark + tagline (inside the safe area) ---------- */
sc.custom(() =>
  `<text x="115" y="8" text-anchor="middle" font-family="Caveat, cursive" font-weight="700" font-size="158" fill="${C.ink}" letter-spacing="1">Fabelo Studio</text>` +
  sv.path('M-40 36 Q 140 20 400 30', { w: 8, stroke: C.red }) +
  `<text x="115" y="104" text-anchor="middle" font-family="Caveat, cursive" font-weight="700" font-size="56" fill="#3A3A3A">little ink stories with big hearts</text>`,
'front');

sc.exposeForRecording();
const q = new URLSearchParams(location.search);
sc.seek(q.has('t') ? parseFloat(q.get('t')) : 3);
}
</script>
</body>
</html>
