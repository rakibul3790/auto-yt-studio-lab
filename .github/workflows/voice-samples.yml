# Makes short voice samples into samples/voices/ so you can pick a voice.
name: Voice samples

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "edge-tts>=7,<8"
      - run: python tools/voice_samples.py
      - name: Save samples to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/
          git diff --cached --quiet && exit 0
          git commit -m "Voice samples"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
