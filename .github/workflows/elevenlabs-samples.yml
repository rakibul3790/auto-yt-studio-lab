# Makes short ElevenLabs voice samples into samples/elevenlabs/ so you can pick a voice.
name: ElevenLabs samples

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/elevenlabs_samples.py
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - name: Save samples to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/
          git diff --cached --quiet && exit 0
          git commit -m "ElevenLabs voice samples"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
